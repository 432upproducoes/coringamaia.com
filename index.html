<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta name="theme-color" content="#020204" />
<meta name="color-scheme" content="dark" />


  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CORINGA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700&display=swap" rel="stylesheet">
  <!-- Supabase Client CDN -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="style.css" />
<script src="js/core.js" defer></script>
<script src="js/visual.js" defer></script>
<script src="js/effects.js" defer></script>
<script src="js/interaction.js" defer></script>

  
  <script>
  // Função para trocar a cor da meta tag do navegador
  function setNavColor(hex) {
    let meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', hex);
  }

  // Observador para capturar os eventos dos cards e modais dinamicamente
  document.addEventListener('mouseover', (e) => {
    const card = e.target.closest('.screen-card');
    if (card) {
      const color = card.style.getPropertyValue('--card-color-active') || '#020204';
      setNavColor(color.trim());
    }
  });

  document.addEventListener('mouseout', (e) => {
    const card = e.target.closest('.screen-card');
    if (card && !document.getElementById('modal-overlay').classList.contains('active')) {
      setNavColor('#020204');
    }
  });

  // Monitora a abertura e fechamento do modal para ajustar a cor
  const modalObserver = new MutationObserver(() => {
    const modal = document.getElementById('modal-overlay');
    if (!modal.classList.contains('active')) {
      setNavColor('#020204');
    }
  });

  const modalEl = document.getElementById('modal-overlay');
  if (modalEl) {
    modalObserver.observe(modalEl, { attributes: true, attributeFilter: ['class'] });
  }
</script>



</head>
<body>

  <div id="crt-screen">
    <canvas id="crt-static-canvas"></canvas>
  </div>

  <div id="blackout-overlay"></div>

  <div id="flash-overlay"></div>

    </div>

  <div id="canvas-container">

  </div>

  <div id="enigma-trigger" title="CHARADA">?</div>

  <div id="universe">
    <div id="central-phrase">O CORINGA DÁ VIDA A TUDO ISSO.</div>
    <div id="constellation-viewport"></div>
  </div>

  <div id="modal-overlay">
    <div id="modal-box" class="modal-content">
      <!-- RENDERIZADO DINAMICAMENTE -->
    </div>
  </div>

  <script src="script.js"></script>
</body>
